<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Boxy Connector</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="selection.js"></script>
</head>
<body>
  <main>
    <form id="service-form">
      <label class="visually-hidden" for="service-url">Service address</label>
      <input id="service-url" name="service-url" type="text" inputmode="url" autocomplete="url" autocapitalize="off" spellcheck="false" required autofocus aria-label="Service address" placeholder="Type Server Link">
      <p id="error" role="alert" aria-live="polite"></p>
    </form>
  </main>
</body>
</html>
