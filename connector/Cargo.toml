[package]
name = "boxy"
version = "2.2.3"
edition = "2021"
license = "Apache-2.0"
publish = false

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build"]

[dependencies]
base64 = "0.22"
dirs = "6"
ed25519-dalek = { version = "2", features = ["rand_core"] }
iana-time-zone = "0.1"
rand_core = { version = "0.6", features = ["getrandom"] }
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sysinfo = "0.39"
tauri = { version = "=2.12.4", features = ["custom-protocol"], optional = true }
tempfile = "3.27"
time = { version = "0.3", features = ["formatting", "local-offset", "macros"] }
ureq = { version = "2", features = ["json"] }
url = "2"
zeroize = "1.9"

[build-dependencies]
tauri-build = { version = "=2.7.3", optional = true }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
xxhash-rust = { version = "0.8", features = ["xxh32"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[[bin]]
name = "boxy"
path = "src/main.rs"
required-features = ["desktop"]

[[example]]
name = "desktop_render_smoke"
path = "../test/desktop_render_smoke.rs"
required-features = ["desktop"]

[[test]]
name = "host_block_status"
path = "../test/connector/host_block_status.test.rs"

[[test]]
name = "launch_options"
path = "../test/launch_options.rs"
