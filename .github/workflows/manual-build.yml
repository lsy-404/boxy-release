name: Manual Portable Release Build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create or update
        required: true
        default: v1.0.3
        type: string
      prerelease:
        description: Mark a newly created release as a pre-release
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  prepare-release:
    name: Prepare Release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Validate release tag
        id: meta
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]; then
            echo "Release tag must look like v0.1.0 or v0.1.0-debug."
            exit 1
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Create or reuse release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            echo "Using existing release $RELEASE_TAG"
            exit 0
          fi
          args=("$RELEASE_TAG" --target "$GITHUB_SHA" --title "Synthesizer V Studio 2 Boxy $RELEASE_TAG" --notes "Portable release for Synthesizer V Studio 2 Boxy.")
          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease --latest=false)
          else
            args+=(--latest)
          fi
          gh release create "${args[@]}" --repo "$REPOSITORY"

  windows:
    name: Windows x64
    needs: prepare-release
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Prepare Fluent UI assets
        run: |
          npm ci
          npm run prepare-ui

      - name: Build portable executable
        working-directory: src-tauri
        run: npm exec --yes --package=@tauri-apps/cli@2.9.6 -- tauri build --target x86_64-pc-windows-msvc --no-bundle

      - name: Upload Windows release assets
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
        shell: pwsh
        run: |
          $portablePath = Join-Path $env:RUNNER_TEMP "synthesizer-v-studio-2-boxy-windows-x64-portable.exe"
          $binaryPath = Join-Path $env:GITHUB_WORKSPACE "target/x86_64-pc-windows-msvc/release/synthesizer-v-studio-2-boxy.exe"
          if (-not (Test-Path -LiteralPath $binaryPath -PathType Leaf)) { throw "Portable executable was not built." }
          Copy-Item -LiteralPath $binaryPath -Destination $portablePath
          gh release upload $env:RELEASE_TAG $portablePath --repo $env:REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw "Failed to upload Windows release assets." }

  macos:
    name: macOS Universal portable app
    needs: prepare-release
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install Rust targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Prepare Fluent UI assets
        run: |
          npm ci
          npm run prepare-ui

      - name: Build universal app
        working-directory: src-tauri
        run: npm exec --yes --package=@tauri-apps/cli@2.9.6 -- tauri build --target universal-apple-darwin --bundles app

      - name: Upload macOS portable asset
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          app_path="$(find target/universal-apple-darwin/release/bundle/macos -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$app_path"
          portable_path="$RUNNER_TEMP/synthesizer-v-studio-2-boxy-macos-universal-portable.zip"
          ditto -c -k --sequesterRsrc --keepParent "$app_path" "$portable_path"
          gh release upload "$RELEASE_TAG" "$portable_path" --repo "$REPOSITORY" --clobber
