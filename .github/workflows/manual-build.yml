name: Manual Portable Release Build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create or update
        required: true
        default: v0.1.0-debug
        type: string
      prerelease:
        description: Mark a newly created release as a pre-release
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  prepare-release:
    name: Prepare Release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Validate release tag
        id: meta
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]; then
            echo "Release tag must look like v0.1.0 or v0.1.0-debug."
            exit 1
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Create or reuse release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            echo "Using existing release $RELEASE_TAG"
            exit 0
          fi
          args=("$RELEASE_TAG" --target "$GITHUB_SHA" --title "SV2 Session Editor $RELEASE_TAG" --notes "Private debug build for SV2 Session Editor.")
          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease --latest=false)
          else
            args+=(--latest)
          fi
          gh release create "${args[@]}" --repo "$REPOSITORY"

  windows:
    name: Windows x64
    needs: prepare-release
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build portable executable
        working-directory: src-tauri
        run: npm exec --yes --package=@tauri-apps/cli@2.9.6 -- tauri build --target x86_64-pc-windows-msvc --no-bundle

      - name: Upload Windows release assets
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
        shell: pwsh
        run: |
          $portablePath = Join-Path $env:RUNNER_TEMP "sv2-session-editor-windows-x64-portable.exe"
          $binaryPath = Join-Path $env:GITHUB_WORKSPACE "target/x86_64-pc-windows-msvc/release/sv2-session-editor.exe"
          if (-not (Test-Path -LiteralPath $binaryPath -PathType Leaf)) { throw "Portable executable was not built." }
          Copy-Item -LiteralPath $binaryPath -Destination $portablePath
          gh release upload $env:RELEASE_TAG $portablePath --repo $env:REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw "Failed to upload Windows release assets." }
