name: Boxy Release Build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v2 release tag to build and upload
        required: true
        type: string

permissions:
  contents: write

jobs:
  prepare-release:
    name: Verify v2 release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Validate release tag
        id: meta
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v2\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]; then
            echo "Release tag must look like v2.0.0."
            exit 1
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Verify existing release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --repo "$REPOSITORY" >/dev/null
          target="$(gh release view "$RELEASE_TAG" --repo "$REPOSITORY" --json targetCommitish --jq .targetCommitish)"
          test "$target" = "$GITHUB_SHA"

  windows-boxy:
    name: Boxy for Windows x64
    needs: prepare-release
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Verify client source
        shell: pwsh
        run: |
          cargo test --locked -p boxy
          cargo build --locked --release -p boxy --target x86_64-pc-windows-msvc

      - name: Package portable Boxy
        shell: pwsh
        run: node scripts/package-portable.mjs x86_64-pc-windows-msvc

      - name: Upload Boxy for Windows
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
        shell: pwsh
        run: |
          $exePath = Join-Path $env:GITHUB_WORKSPACE "dist/boxy-windows-x64.exe"
          if (-not (Test-Path -LiteralPath $exePath -PathType Leaf)) { throw "Portable asset was not packaged: $exePath" }
          gh release upload $env:RELEASE_TAG $exePath --repo $env:REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw "Failed to upload Boxy." }

  macos-boxy:
    name: Boxy for macOS
    needs: prepare-release
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify client source
        run: |
          cargo test --locked -p boxy
          cargo build --locked --release -p boxy

      - name: Package portable Boxy
        run: |
          node scripts/package-portable.mjs "$(rustc -Vv | sed -n 's/^host: //p')"

      - name: Upload Boxy for macOS
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
        run: |
          shopt -s nullglob
          assets=(dist/boxy-macos-*.zip)
          if [ ${#assets[@]} -eq 0 ]; then
            echo "Portable macOS archive was not packaged."
            exit 1
          fi
          gh release upload "$RELEASE_TAG" "${assets[@]}" --repo "$REPOSITORY" --clobber
