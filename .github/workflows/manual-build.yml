name: Boxy Release Build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v2 release tag to build and upload
        required: true
        type: string

permissions:
  contents: write

jobs:
  prepare-release:
    name: Verify v2 release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Validate release tag
        id: meta
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v2\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]; then
            echo "Release tag must look like v2.0.0."
            exit 1
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Verify existing release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --repo "$REPOSITORY" >/dev/null
          target="$(gh release view "$RELEASE_TAG" --repo "$REPOSITORY" --json targetCommitish --jq .targetCommitish)"
          test "$target" = "$GITHUB_SHA"

  windows-boxy:
    name: Boxy for Windows x64
    needs: prepare-release
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc,wasm32-unknown-unknown

      - name: Verify v2 source
        shell: pwsh
        run: |
          cargo test --locked -p sv2-session-codec
          cargo test --locked -p boxy
          cargo build --locked --release -p boxy --target x86_64-pc-windows-msvc

      - name: Upload Boxy for Windows
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
        shell: pwsh
        run: |
          $assetPath = Join-Path $env:RUNNER_TEMP "boxy-windows-x64.exe"
          $binaryPath = Join-Path $env:GITHUB_WORKSPACE "target/x86_64-pc-windows-msvc/release/boxy.exe"
          if (-not (Test-Path -LiteralPath $binaryPath -PathType Leaf)) { throw "Boxy executable was not built." }
          Copy-Item -LiteralPath $binaryPath -Destination $assetPath
          gh release upload $env:RELEASE_TAG $assetPath --repo $env:REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw "Failed to upload Boxy." }

  cloud-verification:
    name: Cloud service verification
    needs: prepare-release
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cloud/package-lock.json

      - name: Install Rust with Wasm target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Validate Cloudflare Worker
        working-directory: cloud
        run: |
          npm ci
          npm run build
          npm run test
